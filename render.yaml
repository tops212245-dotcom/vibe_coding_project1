services:
  # FastAPI Backend Web Service
  - type: web
    name: homeserve-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        value: "sqlite:///./homeserve.db"
      - key: CORS_ORIGINS
        value: "*"
      - key: PAYMENT_SIMULATION_ENABLED
        value: "true"
      - key: FIRST_SUPERADMIN_EMAIL
        value: "admin@homeserve.com"
      - key: FIRST_SUPERADMIN_PASSWORD
        value: "AdminPassword123!"
      - key: FIRST_SUPERADMIN_FIRSTNAME
        value: "Platform"
      - key: FIRST_SUPERADMIN_LASTNAME
        value: "Admin"
